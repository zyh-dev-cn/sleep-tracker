<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睡眠记录</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/vue/3.4.21/vue.global.prod.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f4f6fa;
            color: #1f2937;
            padding: 32px 20px 60px;
        }

        .wrap { max-width: 1080px; margin: 0 auto; }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .card {
            background: #fff;
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, .06);
        }

        .card .label {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .card .value {
            font-size: 26px;
            font-weight: 600;
            color: #4f46e5;
        }

        .card .value small {
            font-size: 13px;
            font-weight: 400;
            color: #6b7280;
            margin-left: 2px;
        }

        .panel {
            background: #fff;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 1px 3px rgba(16, 24, 40, .06);
            margin-bottom: 24px;
        }

        .panel h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .field { display: flex; flex-direction: column; }

        .field label {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .field input, .field select {
            border: 1px solid #e5e7eb;
            border-radius: 9px;
            padding: 9px 11px;
            font-size: 14px;
            color: #1f2937;
            outline: none;
            transition: border-color .15s;
            background: #fff;
        }

        .field input:focus, .field select:focus {
            border-color: #4f46e5;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 18px;
        }

        button.primary {
            background: #4f46e5;
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 10px 22px;
            font-size: 14px;
            cursor: pointer;
            transition: background .15s;
        }

        button.primary:hover { background: #4338ca; }

        button.primary:disabled {
            background: #a5a6f6;
            cursor: not-allowed;
        }

        .ai-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .ai-head h2 { margin-bottom: 0; }

        .ai-body {
            white-space: pre-line;
            font-size: 14px;
            line-height: 1.9;
            color: #374151;
            background: #f8f9ff;
            border: 1px solid #eef0fb;
            border-radius: 10px;
            padding: 16px 18px;
        }

        .msg { font-size: 13px; color: #059669; }

        .auth-wrap {
            min-height: calc(100vh - 92px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border-radius: 16px;
            padding: 32px 30px;
            box-shadow: 0 4px 24px rgba(16, 24, 40, .08);
        }

        .auth-card h1 { margin-bottom: 4px; }

        .auth-card .subtitle { margin-bottom: 24px; }

        .auth-card .field { margin-bottom: 14px; }

        .auth-card .field input { width: 100%; }

        .auth-btn { width: 100%; margin-top: 8px; padding: 11px 0; }

        .auth-switch {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

        .auth-switch a { color: #4f46e5; text-decoration: none; }

        .auth-error {
            font-size: 13px;
            color: #dc2626;
            margin-bottom: 10px;
            min-height: 18px;
        }

        .topbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .topbar h1 { margin-bottom: 4px; }

        .topbar .subtitle { margin-bottom: 0; }

        .user-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 6px;
        }

        table { width: 100%; border-collapse: collapse; }

        th {
            text-align: left;
            font-size: 13px;
            font-weight: 500;
            color: #6b7280;
            padding: 10px 8px;
            border-bottom: 1px solid #eef0f4;
        }

        td {
            font-size: 14px;
            padding: 13px 8px;
            border-bottom: 1px solid #f5f6f8;
        }

        tr:last-child td { border-bottom: none; }

        .tag {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 20px;
            font-size: 12px;
            background: #eef2ff;
            color: #4f46e5;
        }

        .empty {
            text-align: center;
            color: #9ca3af;
            font-size: 14px;
            padding: 32px 0;
        }

        button.link {
            background: none;
            border: none;
            color: #dc2626;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
        }

        button.link:hover { text-decoration: underline; }

        @media (max-width: 820px) {
            .cards { grid-template-columns: repeat(2, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="app" class="wrap">
    <div class="auth-wrap" v-if="!token">
        <div class="auth-card">
            <h1>睡眠记录</h1>
            <p class="subtitle">{{ authMode === 'login' ? '登录后查看你的睡眠数据' : '创建一个新账号' }}</p>
            <div class="field">
                <label>用户名</label>
                <input v-model="authForm.username" placeholder="3-20 个字符" @keyup.enter="doAuth">
            </div>
            <div class="field">
                <label>密码</label>
                <input type="password" v-model="authForm.password" placeholder="至少 6 位" @keyup.enter="doAuth">
            </div>
            <div class="auth-error" v-if="authError">{{ authError }}</div>
            <button class="primary auth-btn" :disabled="authLoading" @click="doAuth">
                {{ authLoading ? '请稍候...' : (authMode === 'login' ? '登 录' : '注 册') }}
            </button>
            <div class="auth-switch">
                <span v-if="authMode === 'login'">还没有账号？<a href="#" @click.prevent="switchAuth('register')">去注册</a></span>
                <span v-else>已有账号？<a href="#" @click.prevent="switchAuth('login')">去登录</a></span>
            </div>
        </div>
    </div>

    <template v-else>
    <div class="topbar">
        <div>
            <h1>睡眠记录</h1>
            <p class="subtitle">记录每晚睡眠，自动计算时长与规律</p>
        </div>
        <div class="user-box">
            <span class="tag">{{ username }}</span>
            <button class="link" @click="logout">退出登录</button>
        </div>
    </div>

    <div class="cards" v-if="stats">
        <div class="card">
            <div class="label">记录天数</div>
            <div class="value">{{ stats.recordCount }}<small>天</small></div>
        </div>
        <div class="card">
            <div class="label">平均睡眠</div>
            <div class="value">{{ fmt(stats.avgSleepMinutes) }}</div>
        </div>
        <div class="card">
            <div class="label">平均入睡耗时</div>
            <div class="value">{{ fmt(stats.avgFallAsleepMinutes) }}</div>
        </div>
        <div class="card">
            <div class="label">平均质量分</div>
            <div class="value">{{ stats.avgQuality }}<small>/ 5</small></div>
        </div>
    </div>

    <div class="panel">
        <h2>睡眠趋势</h2>
        <div ref="chartEl" style="width: 100%; height: 300px;"></div>
    </div>

    <div class="panel">
        <div class="ai-head">
            <h2>AI 睡眠分析</h2>
            <button class="primary" :disabled="aiLoading" @click="getAdvice">
                {{ aiLoading ? '分析中...' : '生成 AI 建议' }}
            </button>
        </div>
        <div class="ai-body" v-if="advice">{{ advice }}</div>
        <div class="empty" v-else>点击按钮，让 AI 根据你的睡眠数据给出建议</div>
    </div>

    <div class="panel">
        <h2>添加记录</h2>
        <div class="form-grid">
            <div class="field">
                <label>上床时间</label>
                <input type="datetime-local" v-model="form.bedTime">
            </div>
            <div class="field">
                <label>睡着时间</label>
                <input type="datetime-local" v-model="form.sleepTime">
            </div>
            <div class="field">
                <label>醒来时间</label>
                <input type="datetime-local" v-model="form.wakeTime">
            </div>
            <div class="field">
                <label>夜里醒了几次</label>
                <input type="number" min="0" v-model.number="form.wakeCount">
            </div>
            <div class="field">
                <label>睡眠质量</label>
                <select v-model.number="form.quality">
                    <option :value="1">1 - 很差</option>
                    <option :value="2">2 - 较差</option>
                    <option :value="3">3 - 一般</option>
                    <option :value="4">4 - 不错</option>
                    <option :value="5">5 - 很好</option>
                </select>
            </div>
            <div class="field">
                <label>备注</label>
                <input type="text" v-model="form.note" placeholder="可选">
            </div>
        </div>
        <div class="actions">
            <button class="primary" @click="submit">保存记录</button>
            <span class="msg" v-if="message">{{ message }}</span>
        </div>
    </div>

    <div class="panel">
        <h2>历史记录</h2>
        <div class="empty" v-if="records.length === 0">还没有记录，先添加一条吧</div>
        <table v-else>
            <thead>
            <tr>
                <th>日期</th>
                <th>上床</th>
                <th>睡着</th>
                <th>醒来</th>
                <th>睡眠时长</th>
                <th>入睡耗时</th>
                <th>质量</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr v-for="r in records" :key="r.id">
                <td>{{ r.bedTime.slice(0, 10) }}</td>
                <td>{{ time(r.bedTime) }}</td>
                <td>{{ time(r.sleepTime) }}</td>
                <td>{{ time(r.wakeTime) }}</td>
                <td><span class="tag">{{ fmt(r.sleepMinutes) }}</span></td>
                <td>{{ fmt(r.fallAsleepMinutes) }}</td>
                <td>{{ r.quality }} 分</td>
                <td><button class="link" @click="remove(r.id)">删除</button></td>
            </tr>
            </tbody>
        </table>
    </div>
    </template>
</div>

<script>
    const { createApp, ref, onMounted, nextTick } = Vue;

    createApp({
        setup() {
            const token = ref(localStorage.getItem('token') || '');
            const username = ref(localStorage.getItem('username') || '');
            const authMode = ref('login');
            const authForm = ref({ username: '', password: '' });
            const authError = ref('');
            const authLoading = ref(false);
            const records = ref([]);
            const stats = ref(null);
            const message = ref('');
            const advice = ref('');
            const aiLoading = ref(false);
            const chartEl = ref(null);
            let chart = null;
            const form = ref({
                bedTime: '',
                sleepTime: '',
                wakeTime: '',
                wakeCount: 0,
                quality: 3,
                note: ''
            });

            async function api(path, options = {}) {
                const headers = Object.assign({}, options.headers || {});
                if (token.value) headers['Authorization'] = 'Bearer ' + token.value;
                if (options.body) headers['Content-Type'] = 'application/json';
                const res = await fetch(path, Object.assign({}, options, { headers }));
                if (res.status === 401) {
                    logout();
                    throw new Error('登录已过期，请重新登录');
                }
                return res;
            }

            async function doAuth() {
                authError.value = '';
                const u = authForm.value.username.trim();
                const p = authForm.value.password;
                if (u.length < 3 || u.length > 20) {
                    authError.value = '用户名需要 3-20 个字符';
                    return;
                }
                if (p.length < 6) {
                    authError.value = '密码至少 6 位';
                    return;
                }
                authLoading.value = true;
                try {
                    const res = await fetch('/api/auth/' + (authMode.value === 'login' ? 'login' : 'register'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: u, password: p })
                    });
                    const data = await res.json();
                    if (!res.ok) {
                        authError.value = data.message || '请求失败';
                        return;
                    }
                    token.value = data.token;
                    username.value = data.username;
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.username);
                    authForm.value = { username: '', password: '' };
                    await nextTick();
                    await load();
                } catch (e) {
                    authError.value = '网络错误：' + e.message;
                } finally {
                    authLoading.value = false;
                }
            }

            function switchAuth(mode) {
                authMode.value = mode;
                authError.value = '';
            }

            function logout() {
                token.value = '';
                username.value = '';
                localStorage.removeItem('token');
                localStorage.removeItem('username');
                records.value = [];
                stats.value = null;
                advice.value = '';
                if (chart) {
                    chart.dispose();
                    chart = null;
                }
            }

            async function load() {
                const [listRes, statsRes] = await Promise.all([
                    api('/api/records'),
                    api('/api/records/stats')
                ]);
                records.value = await listRes.json();
                stats.value = await statsRes.json();
                renderChart();
            }

            function renderChart() {
                if (!chartEl.value) return;
                if (!chart) {
                    chart = echarts.init(chartEl.value);
                }

                const sorted = [...records.value].sort((a, b) => a.bedTime.localeCompare(b.bedTime));
                const days = sorted.map(r => r.bedTime.slice(5, 10));
                const sleepHours = sorted.map(r => r.sleepMinutes == null ? 0 : +(r.sleepMinutes / 60).toFixed(1));
                const fallHours = sorted.map(r => r.fallAsleepMinutes == null ? 0 : +(r.fallAsleepMinutes / 60).toFixed(1));

                chart.setOption({
                    tooltip: { trigger: 'axis', valueFormatter: v => v + ' 小时' },
                    legend: { data: ['睡眠时长', '入睡耗时'], right: 10, top: 0, textStyle: { color: '#6b7280' } },
                    grid: { left: 48, right: 20, top: 44, bottom: 32 },
                    xAxis: {
                        type: 'category',
                        boundaryGap: false,
                        data: days,
                        axisLine: { lineStyle: { color: '#e5e7eb' } },
                        axisLabel: { color: '#6b7280' }
                    },
                    yAxis: {
                        type: 'value',
                        name: '小时',
                        nameTextStyle: { color: '#6b7280' },
                        axisLabel: { color: '#6b7280' },
                        splitLine: { lineStyle: { color: '#f3f4f6' } }
                    },
                    series: [
                        {
                            name: '睡眠时长',
                            type: 'line',
                            smooth: true,
                            symbolSize: 7,
                            data: sleepHours,
                            itemStyle: { color: '#4f46e5' },
                            lineStyle: { width: 3 },
                            areaStyle: {
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                    { offset: 0, color: 'rgba(79,70,229,.25)' },
                                    { offset: 1, color: 'rgba(79,70,229,0)' }
                                ])
                            }
                        },
                        {
                            name: '入睡耗时',
                            type: 'line',
                            smooth: true,
                            symbolSize: 6,
                            data: fallHours,
                            itemStyle: { color: '#f59e0b' },
                            lineStyle: { width: 2, type: 'dashed' }
                        }
                    ]
                });
            }

            async function submit() {
                if (!form.value.bedTime || !form.value.sleepTime || !form.value.wakeTime) {
                    message.value = '三个时间都要填';
                    return;
                }
                const body = {
                    bedTime: form.value.bedTime + ':00',
                    sleepTime: form.value.sleepTime + ':00',
                    wakeTime: form.value.wakeTime + ':00',
                    wakeCount: form.value.wakeCount,
                    quality: form.value.quality,
                    note: form.value.note
                };
                await api('/api/records', {
                    method: 'POST',
                    body: JSON.stringify(body)
                });
                form.value = { bedTime: '', sleepTime: '', wakeTime: '', wakeCount: 0, quality: 3, note: '' };
                message.value = '已保存';
                setTimeout(() => message.value = '', 2000);
                await load();
            }

            async function remove(id) {
                if (!confirm('确定删除这条记录？')) return;
                await api('/api/records/' + id, { method: 'DELETE' });
                await load();
            }

            async function getAdvice() {
                aiLoading.value = true;
                advice.value = '';
                try {
                    const res = await api('/api/records/advice');
                    const data = await res.json();
                    advice.value = data.advice;
                } catch (e) {
                    advice.value = '请求失败：' + e.message;
                } finally {
                    aiLoading.value = false;
                }
            }

            function fmt(minutes) {
                if (minutes === null || minutes === undefined) return '-';
                const m = Math.round(minutes);
                const h = Math.floor(m / 60);
                const rest = m % 60;
                return h > 0 ? h + '小时' + rest + '分' : rest + '分';
            }

            function time(dt) {
                if (!dt) return '-';
                return dt.slice(11, 16);
            }

            onMounted(() => {
                window.addEventListener('resize', () => chart && chart.resize());
                if (token.value) load();
            });

            return {
                token, username, authMode, authForm, authError, authLoading,
                doAuth, switchAuth, logout,
                records, stats, message, advice, aiLoading, form, chartEl,
                submit, remove, getAdvice, fmt, time
            };
        }
    }).mount('#app');
</script>
</body>
</html>
